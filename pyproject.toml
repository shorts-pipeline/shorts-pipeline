# Project tooling config. This does NOT make the repo an installable package —
# there is no [build-system]/[project] table on purpose; it is only a config home
# for pytest and ruff. See ai-plans/repo-ci-lint-and-pinning.md.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"   # matches .venv (Python 3.13)
extend-exclude = [
    "old",
    "archive",
    "temp",
    "_backup_*",
    "sora-profile",
]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors (real bugs: undefined names, unused imports).
# I: import sorting. UP: pyupgrade. B: flake8-bugbear (likely-bug patterns).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Line length: decision made 2026-09-10 -- adopted `ruff format` (see
    # scripts/check.*), which wraps everything it safely can. These are the
    # ~594 remaining lines it won't touch (long strings/URLs/comments/regexes);
    # fixing those is a manual pass, not a config flip.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# assert-related bugbear rule is expected/fine in tests.
"tests/*" = ["B011"]
# server.py is the pipeline-UI package façade: it re-exports a large block of
# names from pipeline_ui.* submodules that tests and handler.py import from
# `pipeline_ui.server`. They read as unused here. Do not auto-strip them.
# It also does `sys.path.insert(...)` then imports project-local modules —
# the deliberate pattern E402 exists to flag, kept here on purpose.
"pipeline_ui/server.py" = ["F401", "E402"]
# One-off scripts: each does `sys.path.insert(str(repo_root))` (or
# `load_dotenv()`) before importing project-local modules, so the imports
# genuinely cannot sit at the top of the file. Same pattern, not a bug.
"scripts/*" = ["E402"]
